<li class="card video-card">
  <a href="{{ .url }}" rel="noopener">
    <img class="thumb" src="https://i.ytimg.com/vi/{{ .video.id }}/mqdefault.jpg" alt="" width="320" height="180" loading="lazy">
    <span class="when">{{ lang.FormatNumber 0 .video.views }} views, {{ (time.AsTime .video.published).Format "January 2006" }}</span>
    <h3>{{ .video.title }}</h3>
  </a>
</li>
