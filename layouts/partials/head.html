{{- $title := cond .IsHome .Site.Title (printf "%s - %s" .Title .Site.Title) -}}
{{- $desc := .Params.description | default .Summary | default .Site.Params.description -}}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ $title }}</title>
  <meta name="description" content="{{ $desc }}">
  <meta name="author" content="{{ .Site.Params.author }}">
  <link rel="canonical" href="{{ .Permalink }}">
  <link rel="icon" type="image/png" href="{{ .Site.Params.favicon | absURL }}">
  <meta property="og:type" content="{{ cond .IsPage "article" "website" }}">
  <meta property="og:title" content="{{ $title }}">
  <meta property="og:description" content="{{ $desc }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:site_name" content="{{ .Site.Title }}">
  <meta property="og:image" content="{{ .Site.Params.ogImage | absURL }}">
  <meta name="twitter:card" content="summary">
  {{ with .OutputFormats.Get "RSS" }}<link rel="alternate" type="application/rss+xml" href="{{ .Permalink }}" title="{{ $.Site.Title }}">{{ end }}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Literata:ital,opsz,wght@0,7..72,300..700;1,7..72,300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "css/notebook.css" | absURL }}">
  <link rel="stylesheet" href="{{ "css/syntax.css" | absURL }}">
