baseURL: "https://irahulpandey.github.io"
languageCode: "en-us"
title: "Rahul Pandey"

# Only the home page, individual pages and posts are rendered.
disableKinds: ["taxonomy", "term", "section"]

params:
  author: "Rahul Pandey"
  description: "Senior Solutions Architect at adidas. Cloud AI and MLOps."
  location: "Germany"
  email: "rpandey1901@gmail.com"
  github: "https://github.com/iRahulPandey"
  linkedin: "https://www.linkedin.com/in/rahulpandey1901/"
  medium: "https://medium.com/@irahulpandey"
  avatar: "/images/avatar.png"
  favicon: "/images/github-mark.png"
  ogImage: "/images/og-image.svg"

markup:
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: false
    noClasses: false
    style: "github"
  goldmark:
    renderer:
      unsafe: true

frontmatter:
  lastmod: ["lastmod", ":fileModTime", ":default"]
  date: ["date", ":fileModTime", ":default"]

sitemap:
  changefreq: weekly
  priority: 0.5
  filename: sitemap.xml

minify:
  minifyOutput: true

outputs:
  home:
    - HTML
    - RSS
